name: CI and Release

# One workflow for verification and releases, so nothing is published unless every check passes.
#
#   verify            - on Linux AND Windows: typecheck, lint, the full test suite, the manifest
#                       check, and a test package build. Runs for every push to main and every pull
#                       request.
#   check             - is the version in package.json released yet (does a v<version> tag exist)?
#   package           - only on main, only for an unreleased version, only after verify passed on
#                       both platforms: build ONE .vsix and record its SHA-256.
#   publish-*         - the same .vsix goes to the Visual Studio Marketplace and to Open VSX, in
#                       parallel. Each job checks the SHA-256 before uploading.
#   github-release    - after both publishes succeed: create the v<version> tag on the built commit
#                       and the GitHub release with that .vsix, its checksum, and CHANGELOG.md notes.
#
# Releasing: bump "version" in package.json, add its CHANGELOG.md section, push to main. Pushes
# that keep an already released (tagged) version only verify.
#
# Required repository secrets: VSCE_PAT (Visual Studio Marketplace) and OVSX_PAT (Open VSX).
# A missing secret fails the run instead of silently skipping a store.
#
# Re-running failed jobs is safe: on a re-run, publishing skips a version the store already has,
# and an existing GitHub release gets its assets replaced with the same files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. main: one run at a time, never cancelled,
# so a release in progress always finishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:manifest
      - name: Package (test build)
        run: npm run package -- --out openboard.vsix

  check:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released yet?
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} already exists; nothing to release. Bump the version in package.json to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} will be released if verification passes"
          fi

  package:
    needs: [verify, check]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.meta.outputs.vsix }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Package name
        id: meta
        run: echo "vsix=openboard-${{ needs.check.outputs.version }}.vsix" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      # The verify jobs already ran the checks on this commit; this only builds the release package.
      - name: Package
        run: npm run package -- --out "${{ steps.meta.outputs.vsix }}"

      - name: Record SHA-256
        id: hash
        run: |
          sha256sum "${{ steps.meta.outputs.vsix }}" > "${{ steps.meta.outputs.vsix }}.sha256"
          cat "${{ steps.meta.outputs.vsix }}.sha256"
          echo "sha256=$(cut -d' ' -f1 "${{ steps.meta.outputs.vsix }}.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish-vs-marketplace:
    needs: package
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.package.outputs.vsix }}
    steps:
      - name: Require VSCE_PAT
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT repository secret is not set"
            exit 1
          fi
      # Checkout + npm ci only to run the vsce version pinned in package-lock.json; nothing is rebuilt.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify SHA-256
        working-directory: release
        run: |
          sha256sum -c "${VSIX}.sha256"
          test "$(sha256sum "$VSIX" | cut -d' ' -f1)" = "${{ needs.package.outputs.sha256 }}"
      - name: Publish
        run: npx vsce publish --packagePath "release/${VSIX}" ${{ github.run_attempt > 1 && '--skip-duplicate' || '' }}

  publish-open-vsx:
    needs: package
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSIX: ${{ needs.package.outputs.vsix }}
    steps:
      - name: Require OVSX_PAT
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT repository secret is not set"
            exit 1
          fi
      # Checkout + npm ci only to run the ovsx version pinned in package-lock.json; nothing is rebuilt.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify SHA-256
        working-directory: release
        run: |
          sha256sum -c "${VSIX}.sha256"
          test "$(sha256sum "$VSIX" | cut -d' ' -f1)" = "${{ needs.package.outputs.sha256 }}"
      - name: Publish
        run: npx ovsx publish "release/${VSIX}" ${{ github.run_attempt > 1 && '--skip-duplicate' || '' }}

  github-release:
    needs: [check, package, publish-vs-marketplace, publish-open-vsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VSIX: ${{ needs.package.outputs.vsix }}
      SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify SHA-256
        working-directory: release
        run: sha256sum -c "${VSIX}.sha256"
      - name: Add checksum to the notes
        working-directory: release
        run: |
          {
            echo
            echo "---"
            echo
            echo "The same \`${VSIX}\` is published to the Visual Studio Marketplace and Open VSX."
            echo
            echo "SHA-256: \`${SHA256}\`"
          } >> release-notes.md
      # Creating the release also creates the tag on the commit that was built.
      - name: Create GitHub release and tag
        working-directory: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "${VSIX}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" "${VSIX}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
